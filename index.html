<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WRKY63 左右雙分割對比分子播放器</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- NGL Viewer WebGL 渲染引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/ngl@2.0.0-dev.37/dist/ngl.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      color: #e2e8f0;
      user-select: none;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    input[type=range] {
      accent-color: #38bdf8;
    }
    .custom-bottom-timeline {
      bottom: calc(2.8rem + env(safe-area-inset-bottom, 0px));
    }
    @media (min-width: 640px) {
      .custom-bottom-timeline {
        bottom: 1.8rem;
      }
    }
    .pulse-danger {
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
      border-color: #ef4444 !important;
    }
  </style>
</head>
<body class="w-screen h-screen relative bg-[#0b0f19] flex flex-col">

  <!-- 3D 渲染視窗容器 -->
  <div id="viewport-container" class="w-full h-full relative flex flex-row overflow-hidden">
    <!-- 左側視窗 (結構 A) -->
    <div id="viewport-a" class="w-full h-full relative cursor-grab active:cursor-grabbing">
      <div class="absolute top-14 left-3 z-10 pointer-events-none flex items-center space-x-1.5 bg-slate-900/80 backdrop-blur-md px-2.5 py-1 rounded-lg border border-cyan-500/40 text-[11px] font-mono font-bold text-cyan-300 shadow-lg">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
        <span id="badge-title-a">視窗 A (主結構)</span>
      </div>
    </div>

    <!-- 右側視窗 (結構 B) -->
    <div id="viewport-b" class="hidden w-1/2 h-full relative cursor-grab active:cursor-grabbing border-l border-slate-700/80">
      <div class="absolute top-14 left-3 z-10 pointer-events-none flex items-center space-x-1.5 bg-slate-900/80 backdrop-blur-md px-2.5 py-1 rounded-lg border border-cyan-500/40 text-[11px] font-mono font-bold text-cyan-300 shadow-lg">
        <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
        <span id="badge-title-b">視窗 B (對比結構)</span>
      </div>
      <!-- 右側視窗即時測距標籤 (HUD B) -->
      <div id="hud-b-badge" class="absolute top-14 right-3 z-10 pointer-events-none flex items-center space-x-1.5 bg-slate-900/85 backdrop-blur-md px-2.5 py-1 rounded-lg border border-slate-700 text-[11px] font-mono font-bold text-emerald-300 shadow-lg">
        <span>B 距離:</span>
        <span id="hud-b-dist-val" class="text-emerald-400">-- Å</span>
      </div>
    </div>
  </div>

  <!-- 頂部控制列 -->
  <header class="absolute top-3 left-3 right-3 z-20 flex flex-wrap items-center justify-between pointer-events-none gap-2">
    <!-- 左側：檔案 A 選單 -->
    <div class="bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-xl px-2.5 py-1.5 flex items-center space-x-2 pointer-events-auto shadow-lg max-w-xs sm:max-w-sm w-full">
      <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 shrink-0" title="結構 A"></span>
      <select id="file-selector-a" class="bg-slate-800 border border-slate-700 text-cyan-200 text-xs rounded-lg px-2 py-1 w-full truncate focus:outline-none cursor-pointer">
        <option value="" disabled selected>搜尋結構中...</option>
      </select>
    </div>

    <!-- 中間：右側檔案 B 選單 -->
    <div id="file-box-b" class="hidden bg-slate-900/90 backdrop-blur-md border border-cyan-500/40 rounded-xl px-2.5 py-1.5 flex items-center space-x-2 pointer-events-auto shadow-lg max-w-xs sm:max-w-sm w-full">
      <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 shrink-0" title="結構 B"></span>
      <select id="file-selector-b" class="bg-slate-800 border border-slate-700 text-cyan-200 text-xs rounded-lg px-2 py-1 w-full truncate focus:outline-none cursor-pointer">
        <option value="" disabled selected>選擇對比結構 B...</option>
      </select>
    </div>

    <!-- 右側功能按鍵群 -->
    <div class="flex items-center space-x-1.5 pointer-events-auto shrink-0">
      <!-- 左右分割對比開關 -->
      <button id="btn-toggle-split" class="bg-slate-900/90 backdrop-blur-md border border-purple-500/50 hover:bg-slate-800 text-purple-300 px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center space-x-1 transition shadow-lg" title="左右各放一個 PDB 同步對比">
        <i data-lucide="columns-2" class="w-3.5 h-3.5 text-purple-400"></i>
        <span>左右對比:</span>
        <span id="split-status" class="font-bold text-slate-400">OFF</span>
      </button>

      <!-- DNA 鹼基對齊按鈕 (依據 DG82 與鹼基環非對稱原子對齊) -->
      <button id="btn-align-dna" class="hidden bg-slate-900/90 backdrop-blur-md border border-indigo-500/50 hover:bg-slate-800 text-indigo-300 px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center space-x-1 transition shadow-lg" title="以 DG82 與 DNA 鹼基環非對稱原子為錨點對齊，保證頭尾同向">
        <i data-lucide="crosshair" class="w-3.5 h-3.5 text-indigo-400"></i>
        <span>DNA鹼基對齊</span>
      </button>

      <!-- DNA 180° 翻轉開關 (若頭尾相反可一鍵翻正) -->
      <button id="btn-flip-dna" class="hidden bg-slate-900/90 backdrop-blur-md border border-amber-500/50 hover:bg-slate-800 text-amber-300 px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center space-x-1 transition shadow-lg" title="若 DNA 頭尾剛好相反，點擊將結構 B 旋轉 180 度翻正">
        <i data-lucide="rotate-cw" class="w-3.5 h-3.5 text-amber-400"></i>
        <span>翻轉 180°</span>
      </button>

      <!-- 視角同步開關 -->
      <button id="btn-toggle-sync" class="hidden bg-slate-900/90 backdrop-blur-md border border-blue-500/50 hover:bg-slate-800 text-blue-300 px-2 py-1.5 rounded-xl text-xs font-medium flex items-center space-x-1 transition shadow-lg" title="同步視角角度">
        <i data-lucide="link" class="w-3.5 h-3.5 text-blue-400"></i>
        <span class="hidden sm:inline">視角同步:</span>
        <span id="sync-status" class="font-bold text-emerald-400">ON</span>
      </button>

      <!-- 特寫按鈕 (兩邊同時特寫透明化並顯示鍵結) -->
      <button id="btn-focus-pair" title="特寫 K114 與 DG82 介面 (雙側同時聚焦透明化)" class="bg-slate-900/90 backdrop-blur-md border border-amber-500/50 hover:bg-amber-950/40 text-amber-300 px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center space-x-1 transition shadow-lg">
        <i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i>
        <span id="focus-btn-text">特寫 K114 - DG82</span>
      </button>

      <!-- 重設視角按鈕 (R) -->
      <button id="btn-reset-view" title="重設整體視角 (R)" class="bg-slate-900/90 backdrop-blur-md border border-slate-700/80 hover:bg-slate-800 text-slate-300 hover:text-white p-2 rounded-xl text-xs transition shadow-lg shrink-0">
        <i data-lucide="maximize" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- 左上方 HUD 面板 -->
  <div id="hud-panel" class="absolute top-24 left-3 z-20 bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-2xl p-3 pointer-events-none shadow-xl flex flex-col space-y-2 min-w-[210px] transition-all duration-300">
    <div class="flex items-center justify-between border-b border-slate-800 pb-1.5">
      <span class="text-[11px] font-bold text-slate-300 flex items-center gap-1.5">
        <span id="status-indicator-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        K114(NZ) - DG82(O6)
      </span>
      <span id="hud-state-badge" class="text-[9px] font-mono px-1.5 py-0.5 rounded font-bold bg-emerald-950/70 border border-emerald-500/50 text-emerald-300">
        結合 (Stable)
      </span>
    </div>

    <div class="flex items-baseline justify-between">
      <span class="text-xs text-slate-400">即時中心距離:</span>
      <span id="hud-distance-val" class="text-lg font-mono font-bold text-emerald-400">2.80 Å</span>
    </div>

    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden flex relative">
      <div id="hud-dist-bar" class="h-full bg-emerald-500 transition-all duration-150" style="width: 28%;"></div>
      <div class="absolute top-0 bottom-0 left-[50%] w-0.5 bg-rose-500/80 z-10" title="3.5 Å 截斷門檻"></div>
    </div>
    <div class="flex justify-between text-[9px] font-mono text-slate-500 px-0.5">
      <span>2.0 Å</span>
      <span class="text-rose-400 font-bold">3.5 Å 門檻</span>
      <span>5.0 Å</span>
    </div>
  </div>

  <!-- 讀取狀態遮罩 -->
  <div id="loading-overlay" class="absolute inset-0 z-50 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center transition-opacity duration-200 pointer-events-none">
    <div class="bg-slate-900 border border-cyan-500/40 rounded-2xl p-5 flex flex-col items-center space-y-2.5 shadow-2xl">
      <div class="w-8 h-8 border-4 border-cyan-500/30 border-t-cyan-400 rounded-full animate-spin"></div>
      <div class="text-xs font-mono text-cyan-300 font-bold" id="loading-text">載入結構中...</div>
    </div>
  </div>

  <!-- 底部軌跡播放控制器 -->
  <footer id="bottom-timeline" class="hidden absolute custom-bottom-timeline left-3 right-3 sm:left-12 sm:right-12 z-20 pointer-events-none flex flex-col items-center">
    <div class="bg-slate-900/95 backdrop-blur-md border border-slate-700/80 w-full max-w-lg rounded-2xl px-4 py-2.5 shadow-2xl pointer-events-auto flex flex-col gap-2">
      <div class="flex items-center space-x-2.5 w-full font-mono text-xs">
        <span class="text-cyan-300 w-8 text-right" id="slider-curr-frame">0</span>
        <input id="trajectory-slider" type="range" min="0" max="0" value="0" step="1" 
               class="flex-1 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer focus:outline-none" />
        <span class="text-slate-400 w-8 text-left" id="slider-total-frame">0</span>
      </div>

      <div class="flex items-center justify-between w-full">
        <button id="btn-loop-mode" class="px-2 py-1 rounded-lg text-xs font-mono bg-slate-800 border border-slate-700 text-cyan-400 hover:text-white transition flex items-center space-x-1">
          <i data-lucide="repeat" class="w-3 h-3"></i>
          <span id="loop-label">循環</span>
        </button>

        <div class="flex items-center space-x-1">
          <button id="btn-first-frame" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <i data-lucide="skip-back" class="w-4 h-4"></i>
          </button>
          <button id="btn-prev-frame" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <i data-lucide="step-back" class="w-4 h-4"></i>
          </button>
          <button id="btn-play" class="p-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold transition shadow-md active:scale-95 mx-1">
            <i id="play-icon" data-lucide="play" class="w-4 h-4 fill-current"></i>
          </button>
          <button id="btn-next-frame" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <i data-lucide="step-forward" class="w-4 h-4"></i>
          </button>
          <button id="btn-last-frame" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <i data-lucide="skip-forward" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="flex items-center space-x-1.5">
          <span id="active-speed-tag" class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-emerald-300 font-bold">10 FPS</span>
          <button id="btn-speed" class="px-2 py-0.5 rounded-lg text-[11px] font-mono bg-slate-800 border border-slate-700 text-slate-300 hover:text-cyan-300 transition" title="點擊切換速率">
            <span id="speed-label">速度</span>
          </button>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const AA_MAP = {
      'ALA':'A','ARG':'R','ASN':'N','ASP':'D','CYS':'C','CYM':'C','CYX':'C',
      'GLN':'Q','GLU':'E','GLY':'G','HIS':'H','HID':'H','HIE':'H','HIP':'H',
      'ILE':'I','LEU':'L','LYS':'K','MET':'M','PHE':'F','PRO':'P','SER':'S',
      'THR':'T','TRP':'W','TYR':'Y','VAL':'V'
    };

    const STANDARD_ANCHOR_W = 108;
    const STANDARD_TARGET_K = 114;
    const STANDARD_TARGET_DG = 82;

    const appState = {
      stageA: null, stageB: null,
      compA: null, trajectoryA: null, totalFramesA: 1, currentFrameA: 0,
      compB: null, trajectoryB: null, totalFramesB: 1,

      isSplitMode: false,
      syncCamera: true,
      isSyncingCam: false,
      blockSync: false,

      isPlaying: false,
      fps: 10,
      loopMode: 'loop',
      direction: 1,
      timerId: null,

      isFocusMode: false,

      actualKResnoInPdbA: null, actualDGResnoInPdbA: null, dynamicPairsA: [], currentDistance: 2.8,
      actualKResnoInPdbB: null, actualDGResnoInPdbB: null, dynamicPairsB: [], currentDistanceB: 2.8,

      repsA: {}, repsB: {},
      transformMatrixB: new NGL.Matrix4(),
      ssSchemeIds: null
    };

    lucide.createIcons();

    const dom = {
      viewportA: document.getElementById('viewport-a'),
      viewportB: document.getElementById('viewport-b'),
      badgeTitleA: document.getElementById('badge-title-a'),
      badgeTitleB: document.getElementById('badge-title-b'),
      hudBBadge: document.getElementById('hud-b-badge'),
      hudBDistVal: document.getElementById('hud-b-dist-val'),
      fileSelectorA: document.getElementById('file-selector-a'),
      fileSelectorB: document.getElementById('file-selector-b'),
      fileBoxB: document.getElementById('file-box-b'),

      btnToggleSplit: document.getElementById('btn-toggle-split'),
      splitStatus: document.getElementById('split-status'),
      btnAlignDna: document.getElementById('btn-align-dna'),
      btnFlipDna: document.getElementById('btn-flip-dna'),
      btnToggleSync: document.getElementById('btn-toggle-sync'),
      syncStatus: document.getElementById('sync-status'),

      loadingOverlay: document.getElementById('loading-overlay'),
      loadingText: document.getElementById('loading-text'),
      bottomTimeline: document.getElementById('bottom-timeline'),
      slider: document.getElementById('trajectory-slider'),
      sliderCurr: document.getElementById('slider-curr-frame'),
      sliderTotal: document.getElementById('slider-total-frame'),
      btnPlay: document.getElementById('btn-play'),
      btnPrevFrame: document.getElementById('btn-prev-frame'),
      btnNextFrame: document.getElementById('btn-next-frame'),
      btnFirstFrame: document.getElementById('btn-first-frame'),
      btnLastFrame: document.getElementById('btn-last-frame'),
      btnLoopMode: document.getElementById('btn-loop-mode'),
      loopLabel: document.getElementById('loop-label'),
      btnSpeed: document.getElementById('btn-speed'),
      activeSpeedTag: document.getElementById('active-speed-tag'),

      btnResetView: document.getElementById('btn-reset-view'),
      btnFocusPair: document.getElementById('btn-focus-pair'),
      focusBtnText: document.getElementById('focus-btn-text'),
      hudPanel: document.getElementById('hud-panel'),
      hudDistVal: document.getElementById('hud-distance-val'),
      hudDistBar: document.getElementById('hud-dist-bar'),
      hudStateBadge: document.getElementById('hud-state-badge'),
      statusIndicatorDot: document.getElementById('status-indicator-dot')
    };

    function showLoading(text) {
      dom.loadingText.textContent = text;
      dom.loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
    }

    function hideLoading() {
      dom.loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
    }

    function registerCustomColorSchemes() {
      const makeSS = (helix, sheet, loop) => function () {
        this.atomColor = function (atom) {
          const ss = atom.sstruc;
          if (ss === 'h' || ss === 'g' || ss === 'i') return helix;
          if (ss === 'e' || ss === 'b') return sheet;
          return loop;
        };
      };
      appState.ssSchemeIds = {
        pymol_ss: NGL.ColormakerRegistry.addScheme(makeSS(0xFF0000, 0xFFFF00, 0x00E000), 'pymol_ss')
      };
    }

    function parseStructureAnalysis(structure, isStageA) {
      const protResList = [];
      const dnaResnos = [];

      structure.eachResidue(r => {
        const rn = (r.resname || '').trim().toUpperCase();
        if (r.isProtein()) {
          protResList.push({ resno: r.resno, code: AA_MAP[rn] || 'X' });
        } else if (r.isNucleic() || /^(D[ATCG][35]?|[ATCG][35]?)$/.test(rn)) {
          dnaResnos.push(r.resno);
        }
      });

      const seqStr = protResList.map(x => x.code).join('');
      const motifIdx = seqStr.indexOf('WRKYGQK');
      let deltaOffset = 0;
      if (motifIdx !== -1) deltaOffset = STANDARD_ANCHOR_W - protResList[motifIdx].resno;

      const actualK = STANDARD_TARGET_K - deltaOffset;
      let actualDG = STANDARD_TARGET_DG;
      if (dnaResnos.includes(STANDARD_TARGET_DG)) actualDG = STANDARD_TARGET_DG;
      else if (dnaResnos.length > 0) actualDG = dnaResnos.find(n => n === 82) || dnaResnos[0];

      if (isStageA) {
        appState.actualKResnoInPdbA = actualK;
        appState.actualDGResnoInPdbA = actualDG;
      } else {
        appState.actualKResnoInPdbB = actualK;
        appState.actualDGResnoInPdbB = actualDG;
      }
    }

    function updateDynamicInteractionsAndHUD(structureA, structureB) {
      if (structureA && appState.actualKResnoInPdbA) {
        appState.dynamicPairsA = [];
        const kAtomsA = [], dgAtomsA = [];

        structureA.eachResidue(r => {
          if (r.resno === appState.actualKResnoInPdbA && r.isProtein()) {
            r.eachAtom(a => { if (a.atomname.trim() === 'NZ') kAtomsA.push({ index: a.index, x: a.x, y: a.y, z: a.z }); });
          }
          if (r.resno === appState.actualDGResnoInPdbA) {
            r.eachAtom(a => { if (a.atomname.trim() === 'O6') dgAtomsA.push({ index: a.index, x: a.x, y: a.y, z: a.z }); });
          }
        });

        if (kAtomsA.length > 0 && dgAtomsA.length > 0) {
          const distA = Math.hypot(kAtomsA[0].x - dgAtomsA[0].x, kAtomsA[0].y - dgAtomsA[0].y, kAtomsA[0].z - dgAtomsA[0].z);
          appState.currentDistance = distA;
          appState.dynamicPairsA.push([kAtomsA[0].index, dgAtomsA[0].index]);

          dom.hudDistVal.textContent = `${distA.toFixed(2)} Å`;
          const pct = Math.min(100, Math.max(0, ((distA - 2.0) / 3.0) * 100));
          dom.hudDistBar.style.width = `${pct}%`;

          if (distA <= 3.2) {
            dom.hudDistVal.className = 'text-lg font-mono font-bold text-emerald-400';
            dom.hudDistBar.className = 'h-full bg-emerald-500 transition-all duration-150';
            dom.hudStateBadge.textContent = '氫鍵鎖定 (Stable)';
          } else if (distA <= 3.5) {
            dom.hudDistVal.className = 'text-lg font-mono font-bold text-yellow-400';
            dom.hudDistBar.className = 'h-full bg-yellow-500 transition-all duration-150';
            dom.hudStateBadge.textContent = '接近邊界 (Stretched)';
          } else {
            dom.hudDistVal.className = 'text-lg font-mono font-bold text-rose-400 animate-pulse';
            dom.hudDistBar.className = 'h-full bg-rose-500 transition-all duration-150';
            dom.hudStateBadge.textContent = '暫態呼吸越線 (Excursion)';
          }
        }
      }

      if (structureB && appState.actualKResnoInPdbB) {
        appState.dynamicPairsB = [];
        const kAtomsB = [], dgAtomsB = [];

        structureB.eachResidue(r => {
          if (r.resno === appState.actualKResnoInPdbB && r.isProtein()) {
            r.eachAtom(a => { if (a.atomname.trim() === 'NZ') kAtomsB.push({ index: a.index, x: a.x, y: a.y, z: a.z }); });
          }
          if (r.resno === appState.actualDGResnoInPdbB) {
            r.eachAtom(a => { if (a.atomname.trim() === 'O6') dgAtomsB.push({ index: a.index, x: a.x, y: a.y, z: a.z }); });
          }
        });

        if (kAtomsB.length > 0 && dgAtomsB.length > 0) {
          const distB = Math.hypot(kAtomsB[0].x - dgAtomsB[0].x, kAtomsB[0].y - dgAtomsB[0].y, kAtomsB[0].z - dgAtomsB[0].z);
          appState.currentDistanceB = distB;
          appState.dynamicPairsB.push([kAtomsB[0].index, dgAtomsB[0].index]);
          dom.hudBDistVal.textContent = `${distB.toFixed(2)} Å`;
        }
      }
    }

    // 表示法配置 (只初始化一次，避開 removeAllRepresentations 碰撞)
    function setupRepresentationsStageA() {
      if (!appState.compA) return;
      appState.compA.removeAllRepresentations();

      appState.repsA.protein = appState.compA.addRepresentation('cartoon', {
        sele: 'protein and not hydrogen and not (_ZN or :ZN or [ZN] or zinc)',
        colorScheme: appState.ssSchemeIds.pymol_ss,
        aspectRatio: 5, subdiv: 12, opacity: 1.0
      });

    function alignDnaBasesHorn() {
      if (!appState.compA || !appState.compB) return;
      const sA = appState.compA.structure;
      const sB = appState.compB.structure;

      const dnaAtomsA = new Map();
      const dnaAtomsB = new Map();

      sA.eachResidue(r => {
        if (!r.isNucleic()) return;
        const offset = r.resno - appState.actualDGResnoInPdbA;
        if (Math.abs(offset) > 5) return;
        r.eachAtom(a => {
          if (a.element !== 'H') dnaAtomsA.set(`${offset}_${a.atomname.trim()}`, [a.x, a.y, a.z]);
        });
      });

      sB.eachResidue(r => {
        if (!r.isNucleic()) return;
        const offset = r.resno - appState.actualDGResnoInPdbB;
        if (Math.abs(offset) > 5) return;
        r.eachAtom(a => {
          if (a.element !== 'H') dnaAtomsB.set(`${offset}_${a.atomname.trim()}`, [a.x, a.y, a.z]);
        });
      });

      const ptsA = [], ptsB = [];
      dnaAtomsA.forEach((posA, key) => {
        if (dnaAtomsB.has(key)) {
          ptsA.push(posA);
          ptsB.push(dnaAtomsB.get(key));
        }
      });

      if (ptsA.length < 10) return;

      let cA = [0, 0, 0], cB = [0, 0, 0];
      const n = ptsA.length;
      for (let i = 0; i < n; i++) {
        cA[0] += ptsA[i][0]; cA[1] += ptsA[i][1]; cA[2] += ptsA[i][2];
        cB[0] += ptsB[i][0]; cB[1] += ptsB[i][1]; cB[2] += ptsB[i][2];
      }
      cA = [cA[0] / n, cA[1] / n, cA[2] / n];
      cB = [cB[0] / n, cB[1] / n, cB[2] / n];

      let Sxx = 0, Sxy = 0, Sxz = 0, Syx = 0, Syy = 0, Syz = 0, Szx = 0, Szy = 0, Szz = 0;
      for (let i = 0; i < n; i++) {
        const ax = ptsA[i][0] - cA[0], ay = ptsA[i][1] - cA[1], az = ptsA[i][2] - cA[2];
        const bx = ptsB[i][0] - cB[0], by = ptsB[i][1] - cB[1], bz = ptsB[i][2] - cB[2];
        Sxx += bx * ax; Sxy += bx * ay; Sxz += bx * az;
        Syx += by * ax; Syy += by * ay; Syz += by * az;
        Szx += bz * ax; Szy += bz * ay; Szz += bz * az;
      }

      const K = [
        [Sxx + Syy + Szz, Syz - Szy,       Szx - Sxz,       Sxy - Syx      ],
        [Syz - Szy,       Sxx - Syy - Szz, Sxy + Syx,       Szx + Sxz      ],
        [Szx - Sxz,       Sxy + Syx,      -Sxx + Syy - Szz, Syz + Szy      ],
        [Sxy - Syx,       Szx + Sxz,       Syz + Szy,      -Sxx - Syy + Szz]
      ];

      let q = [1, 0, 0, 0];
      for (let iter = 0; iter < 30; iter++) {
        let nq = [
          K[0][0]*q[0] + K[0][1]*q[1] + K[0][2]*q[2] + K[0][3]*q[3],
          K[1][0]*q[0] + K[1][1]*q[1] + K[1][2]*q[2] + K[1][3]*q[3],
          K[2][0]*q[0] + K[2][1]*q[1] + K[2][2]*q[2] + K[2][3]*q[3],
          K[3][0]*q[0] + K[3][1]*q[1] + K[3][2]*q[2] + K[3][3]*q[3]
        ];
        const len = Math.hypot(nq[0], nq[1], nq[2], nq[3]) || 1;
        q = [nq[0]/len, nq[1]/len, nq[2]/len, nq[3]/len];
      }

      const [qw, qx, qy, qz] = q;
      const R00 = 1 - 2*qy*qy - 2*qz*qz, R01 = 2*qx*qy - 2*qz*qw,     R02 = 2*qx*qz + 2*qy*qw;
      const R10 = 2*qx*qy + 2*qz*qw,     R11 = 1 - 2*qx*qx - 2*qz*qz, R12 = 2*qy*qz - 2*qx*qw;
      const R20 = 2*qx*qz - 2*qy*qw,     R21 = 2*qy*qz + 2*qx*qw,     R22 = 1 - 2*qx*qx - 2*qy*qy;

      const tx = cA[0] - (R00*cB[0] + R01*cB[1] + R02*cB[2]);
      const ty = cA[1] - (R10*cB[0] + R11*cB[1] + R12*cB[2]);
      const tz = cA[2] - (R20*cB[0] + R21*cB[1] + R22*cB[2]);

      const m4 = new NGL.Matrix4();
      m4.set(
        R00, R01, R02, tx,
        R10, R11, R12, ty,
        R20, R21, R22, tz,
        0,   0,   0,   1
      );

      appState.compB.setTransform(m4);
      appState.transformMatrixB.copy(m4);
      cloneCameraFromAToB();
    }

    function flipDna180() {
      if (!appState.compB) return;
      const sB = appState.compB.structure;
      
      let cX = 0, cY = 0, cZ = 0, count = 0;
      sB.eachResidue(r => {
        if (r.isNucleic()) {
          r.eachAtom(a => { cX += a.x; cY += a.y; cZ += a.z; count++; });
        }
      });
      if (count > 0) { cX /= count; cY /= count; cZ /= count; }

      const rot180 = new NGL.Matrix4();
      rot180.makeRotationX(Math.PI);

      const mTrans = new NGL.Matrix4().makeTranslation(-cX, -cY, -cZ);
      const mInv = new NGL.Matrix4().makeTranslation(cX, cY, cZ);

      const mFlip = new NGL.Matrix4();
      mFlip.multiply(mInv).multiply(rot180).multiply(mTrans);

      appState.transformMatrixB.premultiply(mFlip);
      appState.compB.setTransform(appState.transformMatrixB);
      cloneCameraFromAToB();
    }

    function cloneCameraFromAToB() {
      if (!appState.stageA || !appState.stageB || !appState.isSplitMode) return;
      const orient = appState.stageA.viewerControls.getOrientation();
      appState.stageB.viewerControls.orient(orient);
      appState.stageB.viewer.requestRender();
    }

    function setFrame(targetFrame) {
      const maxF = appState.totalFramesA - 1;
      let f = Math.max(0, Math.min(targetFrame, maxF));
      appState.currentFrameA = f;

      if (appState.trajectoryA) appState.trajectoryA.setFrame(f);
      if (appState.trajectoryB) appState.trajectoryB.setFrame(f % (appState.trajectoryB.frameCount || 1));

      const stA = appState.compA ? appState.compA.structure : null;
      const stB = appState.compB ? appState.compB.structure : null;
      updateDynamicInteractionsAndHUD(stA, stB);

      dom.slider.value = f;
      dom.sliderCurr.textContent = f;
    }

    function stepFrame(step) {
      if (appState.totalFramesA <= 1) return;
      let next = appState.currentFrameA + step;
      const maxF = appState.totalFramesA - 1;

      if (appState.loopMode === 'loop') {
        if (next > maxF) next = 0;
        if (next < 0) next = maxF;
      } else if (appState.loopMode === 'rock') {
        if (next > maxF) { appState.direction = -1; next = maxF - 1; }
        else if (next < 0) { appState.direction = 1; next = 1; }
      } else if (appState.loopMode === 'once') {
        if (next > maxF || next < 0) {
          pausePlayback();
          setFrame(next > maxF ? maxF : 0);
          return;
        }
      }
      setFrame(next);
    }

    function pausePlayback() {
      appState.isPlaying = false;
      if (appState.timerId) {
        clearInterval(appState.timerId);
        appState.timerId = null;
      }
      updatePlayIcon(false);
    }

    function startPlayback() {
      if (appState.totalFramesA <= 1) return;
      pausePlayback();
      appState.isPlaying = true;
      updatePlayIcon(true);

      const intervalMs = Math.round(1000 / appState.fps);
      appState.timerId = setInterval(() => {
        stepFrame(appState.direction);
      }, intervalMs);
    }

    function togglePlay() {
      if (appState.isPlaying) pausePlayback();
      else startPlayback();
    }

    function updatePlayIcon(playing) {
      const icon = dom.btnPlay.querySelector('i');
      if (!icon) return;
      icon.setAttribute('data-lucide', playing ? 'pause' : 'play');
      lucide.createIcons();
    }

    // 特寫：放大視角，不讓相機近裁剪面切掉蛋白質
    function toggleFocus() {
      if (!appState.compA) return;
      appState.isFocusMode = !appState.isFocusMode;
      appState.blockSync = true;

      updateFocusVisualParameters();

      if (appState.isFocusMode) {
        dom.btnFocusPair.classList.add('bg-amber-500/30', 'border-amber-400');
        dom.focusBtnText.textContent = '重設視角';
        appState.stageA.animationControls.zoom(1.6, 300);
      } else {
        dom.btnFocusPair.classList.remove('bg-amber-500/30', 'border-amber-400');
        dom.focusBtnText.textContent = '特寫 K114 - DG82';
        appState.stageA.autoView(300);
      }

      setTimeout(() => {
        cloneCameraFromAToB();
        appState.blockSync = false;
      }, 350);
    }

    async function loadPdbFileA(url) {
      pausePlayback();
      showLoading(`載入視窗 A: ${url}`);
      dom.bottomTimeline.classList.add('hidden');

      try {
        appState.stageA.removeAllComponents();

        const comp = await appState.stageA.loadFile(url, { defaultRepresentation: false, asTrajectory: true });
        appState.compA = comp;
        dom.badgeTitleA.textContent = `視窗 A: ${url.replace(/\.pdb(\.gz)?$/i, '')}`;

        comp.structure.eachResidue(r => {
          const rn = (r.resname || '').trim().toUpperCase();
          if (rn === 'CYM') r.resname = 'CYS';
          if (rn === 'HIE' || rn === 'HID' || rn === 'HIP') r.resname = 'HIS';
        });

        applySecondaryStructure(comp);
        parseStructureAnalysis(comp.structure, true);
        updateDynamicInteractionsAndHUD(comp.structure, appState.compB ? appState.compB.structure : null);
        
        setupRepresentationsStageA();
        comp.autoView(300);

        const trajComp = comp.addTrajectory();
        appState.trajectoryA = trajComp.trajectory;

        appState.trajectoryA.signals.frameChanged.add(function (frameIndex) {
          appState.currentFrameA = frameIndex;
          dom.slider.value = frameIndex;
          dom.sliderCurr.textContent = frameIndex;
          const stB = appState.compB ? appState.compB.structure : null;
          updateDynamicInteractionsAndHUD(comp.structure, stB);
        });

        const handleCount = (count) => {
          if (count > 1) {
            appState.totalFramesA = count;
            dom.slider.max = count - 1;
            dom.sliderTotal.textContent = String(count - 1);
            dom.bottomTimeline.classList.remove('hidden');
            dom.bottomTimeline.classList.add('flex');
            setFrame(0);
            startPlayback();
          } else {
            appState.totalFramesA = 1;
            dom.bottomTimeline.classList.add('hidden');
            dom.bottomTimeline.classList.remove('flex');
          }
        };

        appState.trajectoryA.signals.countChanged.add(handleCount);
        handleCount(appState.trajectoryA.frameCount || 1);

      } catch (err) {
        console.error('結構 A 載入失敗:', err);
      } finally {
        hideLoading();
      }
    }

    async function loadPdbFileB(url) {
      if (!url) return;
      showLoading(`載入視窗 B: ${url}`);

      try {
        appState.stageB.removeAllComponents();

        const comp = await appState.stageB.loadFile(url, { defaultRepresentation: false, asTrajectory: true });
        appState.compB = comp;
        dom.badgeTitleB.textContent = `視窗 B: ${url.replace(/\.pdb(\.gz)?$/i, '')}`;

        comp.structure.eachResidue(r => {
          const rn = (r.resname || '').trim().toUpperCase();
          if (rn === 'CYM') r.resname = 'CYS';
          if (rn === 'HIE' || rn === 'HID' || rn === 'HIP') r.resname = 'HIS';
        });

        applySecondaryStructure(comp);
        parseStructureAnalysis(comp.structure, false);
        updateDynamicInteractionsAndHUD(appState.compA ? appState.compA.structure : null, comp.structure);
        
        setupRepresentationsStageB();

        try {
          const trajCompB = comp.addTrajectory();
          appState.trajectoryB = trajCompB.trajectory;
        } catch (e) {}

        alignDnaBasesHorn();
      } catch (err) {
        console.error('結構 B 載入失敗:', err);
      } finally {
        hideLoading();
      }
    }

    function enableSplitMode() {
      appState.isSplitMode = true;
      dom.splitStatus.textContent = 'ON';
      dom.splitStatus.className = 'font-bold text-purple-400';
      dom.btnToggleSync.classList.remove('hidden');
      dom.btnAlignDna.classList.remove('hidden');
      dom.btnFlipDna.classList.remove('hidden');
      dom.fileBoxB.classList.remove('hidden');

      dom.viewportA.classList.remove('w-full');
      dom.viewportA.classList.add('w-1/2');
      dom.viewportB.classList.remove('hidden');
      dom.viewportB.classList.add('w-1/2');

      appState.stageB.handleResize();

        loadPdbFileB(dom.fileSelectorB.value);

        cloneCameraFromAToB();

    function disableSplitMode() {
      appState.isSplitMode = false;
      dom.splitStatus.textContent = 'OFF';
      dom.splitStatus.className = 'font-bold text-slate-400';
      dom.btnToggleSync.classList.add('hidden');
      dom.btnAlignDna.classList.add('hidden');
      dom.btnFlipDna.classList.add('hidden');
      dom.fileBoxB.classList.add('hidden');

      dom.viewportB.classList.add('hidden');
      dom.viewportB.classList.remove('w-1/2');
      dom.viewportA.classList.remove('w-1/2');

      appState.stageA.autoView(0);

    function initCameraSync() {
      appState.stageA.viewerControls.signals.changed.add(() => {
        if (!appState.isSplitMode || !appState.syncCamera || appState.isSyncingCam || appState.blockSync || !appState.stageB) return;
        appState.isSyncingCam = true;
        cloneCameraFromAToB();
        appState.isSyncingCam = false;
      });

      appState.stageB.viewerControls.signals.changed.add(() => {
        if (!appState.isSplitMode || !appState.syncCamera || appState.isSyncingCam || appState.blockSync || !appState.stageA) return;
        appState.isSyncingCam = true;
        const orient = appState.stageB.viewerControls.getOrientation();
        appState.stageA.viewerControls.orient(orient);
        appState.stageA.viewer.requestRender();
        appState.isSyncingCam = false;
      });
    }

    async function scanFolderFiles() {
      const urlParams = new URLSearchParams(window.location.search);
      const specifiedFile = urlParams.get('file') || urlParams.get('pdb');
      const specifiedFileB = urlParams.get('fileB') || urlParams.get('pdbB');

      let found = [];
      const hostname = window.location.hostname;
      const pathname = window.location.pathname.replace(/^\/|\/$/g, '');

      if (hostname.endsWith('github.io') && pathname) {
        const owner = hostname.split('.')[0];
        const repo = pathname.split('/')[0];
        try {
          const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents`);
          if (res.ok) {
            const data = await res.json();
            found = data
              .filter(item => item.type === 'file' && (item.name.endsWith('.pdb') || item.name.endsWith('.pdb.gz')))
              .map(item => item.name);
          }
        } catch (e) {}
      }

      dom.fileSelectorA.innerHTML = '';
      dom.fileSelectorB.innerHTML = '<option value="" disabled selected>選擇對比檔案 B...</option>';

      if (found.length > 0) {
        found.forEach(name => {
          const optA = document.createElement('option');
          optA.value = name; optA.textContent = name;
          dom.fileSelectorA.appendChild(optA);

          const optB = document.createElement('option');
          optB.value = name; optB.textContent = name;
          dom.fileSelectorB.appendChild(optB);
        });

        const initialA = specifiedFile || found[0];
        dom.fileSelectorA.value = initialA;
        loadPdbFileA(initialA);

        const initialB = specifiedFileB || (found.length > 1 ? found[1] : found[0]);
        dom.fileSelectorB.value = initialB;
        if (specifiedFileB) enableSplitMode();
      } else {
        if (specifiedFile) {
          dom.fileSelectorA.innerHTML = `<option value="${specifiedFile}">${specifiedFile}</option>`;
          loadPdbFileA(specifiedFile);
        } else {
          hideLoading();
        }
      }
    }

      dom.fileSelectorA.addEventListener('change', (e) => loadPdbFileA(e.target.value));
      dom.fileSelectorB.addEventListener('change', (e) => loadPdbFileB(e.target.value));

      dom.btnPlay.addEventListener('click', togglePlay);
      dom.btnPrevFrame.addEventListener('click', () => { pausePlayback(); stepFrame(-1); });
      dom.btnNextFrame.addEventListener('click', () => { pausePlayback(); stepFrame(1); });
      dom.btnFirstFrame.addEventListener('click', () => { pausePlayback(); setFrame(0); });
      dom.btnLastFrame.addEventListener('click', () => { pausePlayback(); setFrame(appState.totalFramesA - 1); });

      dom.slider.addEventListener('input', (e) => {
        pausePlayback();
        setFrame(parseInt(e.target.value, 10));
      });

      dom.btnToggleSplit.addEventListener('click', () => {
        if (appState.isSplitMode) disableSplitMode();
        else enableSplitMode();
      });

      dom.btnAlignDna.addEventListener('click', alignDnaBasesHorn);
      dom.btnFlipDna.addEventListener('click', flipDna180);

      dom.btnToggleSync.addEventListener('click', () => {
        appState.syncCamera = !appState.syncCamera;
        dom.syncStatus.textContent = appState.syncCamera ? 'ON' : 'OFF';
        dom.syncStatus.className = appState.syncCamera ? 'font-bold text-emerald-400' : 'font-bold text-slate-500';
        if (appState.syncCamera) cloneCameraFromAToB();
      });

      dom.btnSpeed.addEventListener('click', () => {
        const speeds = [5, 10, 15, 20];
        const curIdx = speeds.indexOf(appState.fps);
        appState.fps = speeds[(curIdx + 1) % speeds.length];
        dom.activeSpeedTag.textContent = `${appState.fps} FPS`;
        if (appState.isPlaying) {
          pausePlayback();
          startPlayback();
        }
      });

      dom.btnLoopMode.addEventListener('click', () => {
        if (appState.loopMode === 'loop') {
          appState.loopMode = 'rock'; dom.loopLabel.textContent = '往返';
        } else if (appState.loopMode === 'rock') {
          appState.loopMode = 'once'; dom.loopLabel.textContent = '單次';
        } else {
          appState.loopMode = 'loop'; dom.loopLabel.textContent = '循環';
        }
      });

      dom.btnResetView.addEventListener('click', () => {
        appState.isFocusMode = false;
        dom.btnFocusPair.classList.remove('bg-amber-500/30', 'border-amber-400');
        dom.focusBtnText.textContent = '特寫 K114 - DG82';
        updateFocusVisualParameters();
        if (appState.compA) appState.stageA.autoView(300);
        setTimeout(cloneCameraFromAToB, 350);
      });

      dom.btnFocusPair.addEventListener('click', toggleFocus);

      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'SELECT'].includes(e.target.tagName)) return;
        if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
        else if (e.code === 'ArrowRight') dom.btnNextFrame.click();
        else if (e.code === 'ArrowLeft') dom.btnPrevFrame.click();
        else if (e.key === 'r' || e.key === 'R') dom.btnResetView.click();
      });
    }

    window.addEventListener('load', () => {
      registerCustomColorSchemes();

      const stageConfig = {
        backgroundColor: '#0b0f19',
        cameraType: 'perspective',
        ambientColor: 0xffffff,
        ambientIntensity: 0.55,
        lightColor: 0xffffff,
        lightIntensity: 0.95,
        clipNear: 0, clipFar: 100,
        clipMode: 'scene',
        fogNear: 100, fogFar: 100
      };

      appState.stageA = new NGL.Stage('viewport-a', stageConfig);
      appState.stageB = new NGL.Stage('viewport-b', stageConfig);

      initCameraSync();

      window.addEventListener('resize', () => {
        appState.stageA.handleResize();
        appState.stageB.handleResize();
      });

      initEvents();
      scanFolderFiles();
    });
  </script>
</body>
</html>
